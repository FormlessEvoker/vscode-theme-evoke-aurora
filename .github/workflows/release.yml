name: Release VSIX

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Read release label
        id: release_label
        uses: actions/github-script@v7
        with:
          script: |
            const allowed = new Set(['major', 'minor', 'patch']);
            const labels = context.payload.pull_request.labels.map(({ name }) => name);
            const selected = labels.filter((label) => allowed.has(label));

            if (selected.length !== 1) {
              throw new Error(
                `Merged PR requires exactly one release label. Found: ${selected.join(', ') || 'none'}.`,
              );
            }

            core.setOutput('bump', selected[0]);

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump extension version
        run: npm version "${{ steps.release_label.outputs.bump }}" --no-git-tag-version

      - name: Read release version
        id: version
        run: echo "value=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Build VSIX
        run: npx --yes @vscode/vsce package

      - name: Commit version and tag release
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "release: v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:main --follow-tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "v${VERSION}" "evoke-aurora-theme-${VERSION}.vsix" \
            --title "Evoke Aurora v${VERSION}" \
            --generate-notes
